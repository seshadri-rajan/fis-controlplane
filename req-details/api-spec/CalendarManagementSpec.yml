openapi: 3.0.3
info:
  title: Calendar Management API
  version: 1.0.0
  description: |
    API for managing named calendars and their dates.

    All operations, including login, require a bearer token in the standard
    Authorization header: Authorization: Bearer <token>.

    Calendar names are case-sensitive and unique. Dates are full-date
    strings (DD-MM-YYYY), without time or timezone components. Date arrays
    contain unique values and are returned in ascending order.

    Read operations are available to all authenticated roles. Calendar
    creation, update, and upload require EDITOR or ADMIN. Deletion requires
    ADMIN or EDITOR.

servers:
  - url: /v1
    description: Version 1 API root

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Authenticate credentials and retrieve user information.
  - name: Calendars
    description: Create, retrieve, update, and delete calendars.
  - name: Calendar Dates
    description: Retrieve and upload calendar dates.
  - name: Users
    description: Manage user accounts and change passwords.

paths:
  /users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Add a user
      description: |
        Requires ADMIN. Creates a user with a unique, case-sensitive username.
        Passwords must never be returned or logged and must be stored as
        salted password hashes, not plaintext.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/UserConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
    get:
      tags: [Users]
      operationId: getUsers
      summary: Get user details
      description: |
        Requires ADMIN. Get all users list.
      parameters:
        - name: limit
          in: query
          description: The number of items to return
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          description: The page number to return
          required: false
          schema:
            type: integer
            default: 1
        - name: id
          in: query
          description: User Id
          required: false
          schema:
            type: string
        - name: firstName
          in: query
          description: First Name of user
          required: false
          schema:
            type: string
        - name: lastName
          in: query
          description: Last Name of user
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: User status active/inactvie
          required: false
          schema:
            type: string
      responses:
        '200':
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/UserConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'

    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user
      description: |
        Requires ADMIN. Fetch the user details of specific user based on userId
      responses:
        '200':
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/UserConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{user_id}/update:
    parameters:
      - $ref: '#/components/parameters/UserId'

    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update a user
      description: |
        Requires ADMIN. Updates only supplied fields; omitted fields remain
        unchanged. User ID and username are immutable. Password changes use
        the dedicated password endpoint. Null field values are not accepted.
        The last active ADMIN cannot be deactivated or demoted (409).
        Role changes and deactivation invalidate the user's existing sessions
        and access tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/UserConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{user_id}/delete:
    parameters:
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        Requires ADMIN. Deletes the user account and invalidates its sessions
        and access tokens. Historical calendar audit information is preserved.
        The last active ADMIN cannot be deleted (409).
      responses:
        '204':
          description: User deleted successfully. No response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/UserConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{user_id}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'

    put:
      tags: [Users]
      operationId: updateUserPassword
      summary: Update the authenticated user's password
      description: |
        Available to every authenticated role for its own account only.
        The path user_id must match the authenticated user's ID; requests
        targeting another user return 403, including requests by ADMIN.
        This is a password change, not an administrative password reset.
        The current password must be correct (403 otherwise), and the new
        password must differ from the current password (400 otherwise).
        Passwords must never be returned or logged and must be stored as
        salted password hashes. Success invalidates all existing sessions
        and access tokens for the user, including the calling session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '204':
          description: Password updated successfully. No response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The target account does not belong to the authenticated user,
            the current password is incorrect, or account policy forbids
            password changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate a user
      description: |
        Validates username and password and returns user information and an
        access token. A bearer token is also required for this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
          headers:
            Cache-Control:
              description: Prevents caching of credentials and tokens.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calendars:
    post:
      tags: [Calendars]
      operationId: createCalendar
      summary: Create a calendar
      description: |
        Creates a uniquely named calendar. Requires EDITOR or ADMIN.
        Duplicate dates are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarCreateRequest'
      responses:
        '201':
          description: Calendar created successfully.
          headers:
            Location:
              description: Relative URI of the created calendar.
              schema:
                type: string
              example: /v1/calendar/calendars/business-calendar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [Calendars]
      operationId: listCalendars
      summary: Get a paginated list of calendars
      description: |
        Returns calendars ordered by calendarName ascending.
        An empty collection returns 200 with an empty items array.
      parameters:
        - name: limit
          in: query
          description: The number of items to return
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          description: The page number to return
          required: false
          schema:
            type: integer
            default: 1
        - name: calendarName
          in: query
          description: Search by calendar name
          required: false
          schema:
            type: string
            default: null
        - name: migrated
          in: query
          description: Flag to determine if its migrated Calendar
          required: false
          schema:
            type: boolean
        - name: ruleType
          in: query
          description: Rule applied on the calendar
          required: false
          schema:
            type: string
        - name: createDateFrom
          in: query
          description: Create date of calendar from
          required: false
          schema:
            type: string
            format: date
        - name: createDateTo
          in: query
          description: Create date of calendar to
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Paginated calendars retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calendars/{calendar_name}:
    parameters:
      - $ref: '#/components/parameters/CalendarName'

    get:
      tags: [Calendars]
      operationId: getCalendar
      summary: Get a calendar by name
      parameters:
      responses:
        '200':
          description: Calendar retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calendars/{calendar_name}/update:
    parameters:
      - $ref: '#/components/parameters/CalendarName'

    patch:
      tags: [Calendars]
      operationId: updateCalendar
      summary: Update an existing calendar
      description: |
        Replaces all writable calendar fields. Requires EDITOR or ADMIN.
        The request body's calendarName must match the path calendar_name.
        Renaming and creation through this operation are not supported.
        Duplicate dates are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarWriteRequest'
      responses:
        '200':
          description: Calendar updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calendars/{calendar_name}/delete:
    parameters:
      - $ref: '#/components/parameters/CalendarName'

    delete:
      tags: [Calendars]
      operationId: deleteCalendar
      summary: Delete a calendar
      description: Permanently deletes a calendar and its dates. Requires ADMIN.
      responses:
        '204':
          description: Calendar deleted successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calendars/{calendar_name}/dates:
    parameters:
      - $ref: '#/components/parameters/CalendarName'

    get:
      tags: [Calendar Dates]
      operationId: getCalendarDates
      summary: Get calendar dates
      description: |
        Returns the calendar's stored dates as a JSON array of ISO 8601
        full-date strings, sorted ascending. An empty calendar returns [].
        Date rules and holiday offsets are metadata and do not transform
        the stored dates returned by this operation.
      responses:
        '200':
          description: Calendar dates retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarDates'
              example:
                - '2026-01-01'
                - '2026-12-25'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calendars/{calendar_name}/upload:
    parameters:
      - $ref: '#/components/parameters/CalendarName'

    post:
      tags: [Calendar Dates]
      operationId: uploadCalendarDates
      summary: Upload calendar dates from a CSV file
      description: |
        Requires EDITOR or ADMIN and an existing calendar.

        Accepts a UTF-8 CSV file containing exactly one column with the header
        date. Each subsequent record must contain one ISO 8601 full-date value
        (YYYY-MM-DD). The maximum file size is 5 MiB (5,242,880 bytes).

        Atomically replaces the stored dates without changing other calendar
        fields. Duplicate or invalid dates cause the entire upload to fail.
        A header-only CSV clears the dates array. An empty file is invalid.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: UTF-8 CSV file with a single date column.
            encoding:
              file:
                contentType: text/csv
      responses:
        '200':
          description: Dates replaced successfully; returns the updated calendar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Uploaded file exceeds the 5 MiB limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request or uploaded file has an unsupported media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Required for every operation, including login.
        Supply Authorization: Bearer <token>.

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      description: Unique user account identifier.
      schema:
        type: string
        format: uuid
      example: 6b0bd8e8-55f3-4f20-a199-25a5808a7cce

    CalendarName:
      name: calendar_name
      in: path
      required: true
      description: Unique, case-sensitive calendar name.
      schema:
        $ref: '#/components/schemas/CalendarName'

  schemas:
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password, firstName, lastName, role]
      properties:
        username:
          $ref: '#/components/schemas/User/properties/username'
        password:
          $ref: '#/components/schemas/NewPassword'
        firstName:
          $ref: '#/components/schemas/User/properties/firstName'
        lastName:
          $ref: '#/components/schemas/User/properties/lastName'
        email:
          $ref: '#/components/schemas/User/properties/email'
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
          description: Whether the new account is enabled.
          default: true

    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one updatable field must be supplied.
      properties:
        firstName:
          $ref: '#/components/schemas/User/properties/firstName'
        lastName:
          $ref: '#/components/schemas/User/properties/lastName'
        email:
          $ref: '#/components/schemas/User/properties/email'
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
          description: Whether the account is enabled.

    NewPassword:
      type: string
      format: password
      minLength: 12
      maxLength: 1024
      writeOnly: true
      description: New password of 12 to 1024 characters; never returned or logged.

    UpdatePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          writeOnly: true
          description: Current password used to verify account ownership.
        newPassword:
          $ref: '#/components/schemas/NewPassword'

    CalendarName:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$'
      description: |
        Starts with an ASCII letter or digit and contains only ASCII letters,
        digits, underscores, and hyphens.
      example: business-calendar

    CalendarDate:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: Valid  full-date in DD-MM-YYYY format.
      example: '25-12-2027'

    CalendarDates:
      type: array
      uniqueItems: true
      description: Unique calendar dates; responses are sorted ascending.
      items:
        $ref: '#/components/schemas/CalendarDate'
      example:
        - '01-01-2027'
        - '25-12-2027'

    DateRuleType:
      type: string
      enum:
        - WORKING_DAY
        - QUARTER_START_WORKING_DAY
        - CALENDAR_DAY
        - FIXED_DATE_YEARLY
        - QUARTER_END_WORKING_DAY
      description: |
        Scheduling classification associated with the calendar
      example: WORKING_DAY

    
    RunDate:
      type: string
      example: '01-01'
      description: Fixed day and month for fixed date rules
    RunDay:
      type: string
      example: '10'
      description: The nth day of month or year based on the rule
    HolidayCalendar:
      type: string
      description: Holiday calendar used by this calendar
      example: 'holiday-calendar'
    HolidayRun:
      type: boolean
      description: Flag to determine if holidays need to be considered for run
      example: false
    HolidayOffset:
      type: integer
      description: Signed holiday scheduling offset in calendar days.
      example: -1

    DayOfWeek:
      type: string
      description: Day of the week.
      example: 'MONDAY'

    CalendarCreateRequest:
      type: object
      additionalProperties: false
      allOf: 
        - type: object
          required:
            - calendarName
          properties:
            calendarName:
              $ref: '#/components/schemas/CalendarName'
        - $ref: '#/components/schemas/CalendarWriteRequest'

    CalendarWriteRequest:
      type: object
      additionalProperties: false
      required:
        - dates
        - holidayCalendar
      properties:
        dates:
          $ref: '#/components/schemas/CalendarDates'
        dateRuleType:
          $ref: '#/components/schemas/DateRuleType'
        dayOfWeek:
          type: array
          uniqueItems: true
          items: 
            $ref: '#/components/schemas/DayOfWeek'
        runDate:
          $ref: '#/components/schemas/RunDate'
        runDay:
          $ref: '#/components/schemas/RunDay'
        holidayCalendar:
          $ref: '#/components/schemas/HolidayCalendar'
        holidayRun:
          $ref: '#/components/schemas/HolidayRun'
        holidayOffset:
          $ref: '#/components/schemas/HolidayOffset'

    Calendar:
      type: object
      additionalProperties: false
      properties:
        calendarName:
          $ref: '#/components/schemas/CalendarName'
        dates:
          $ref: '#/components/schemas/CalendarDates'
        dateRuleType:
          $ref: '#/components/schemas/DateRuleType'
        migrated:
          type: boolean
          example: false
        uploaded:
          type: boolean
          description: Flag to determine if this calendar was uploaded via file or created from UI
        dayOfWeek:
          type: array
          uniqueItems: true
          items: 
            $ref: '#/components/schemas/DayOfWeek'
        runDate:
          $ref: '#/components/schemas/RunDate'
        runDay:
          $ref: '#/components/schemas/RunDay'
        holidayCalendar:
          $ref: '#/components/schemas/HolidayCalendar'
        holidayRun:
          $ref: '#/components/schemas/HolidayRun'
        holidayOffset:
          $ref: '#/components/schemas/HolidayOffset'
        createdBy:
          type: string
          readOnly: true
          minLength: 1
          description: Username of the authenticated creator.
          example: alex smith
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Creation timestamp in UTC.
          example: '2026-11-03T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Last modification timestamp in UTC; initially createdAt.
          example: '2026-11-03T10:00:00Z'
    CalendarPage:
      type: object
      additionalProperties: false
      required: [calendars, page, pageSize, totalItems, totalPages]
      properties:
        calendars:
          type: array
          items:
            $ref: '#/components/schemas/Calendar'
        page:
          type: integer
          format: int32
          minimum: 1
          example: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          example: 20
        totalItems:
          type: integer
          format: int64
          minimum: 0
          example: 42
        totalPages:
          type: integer
          format: int64
          minimum: 0
          description: Ceiling of totalItems divided by pageSize; zero when empty.
          example: 3
    
    
    UserList:
      type: object
      additionalProperties: false
      required: [users, page, pageSize, totalItems, totalPages]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
          format: int32
          minimum: 1
          example: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          example: 20
        totalItems:
          type: integer
          format: int64
          minimum: 0
          example: 42
        totalPages:
          type: integer
          format: int64
          minimum: 0
          description: Ceiling of totalItems divided by pageSize; zero when empty.
          example: 3

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          example: alex.smith
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          writeOnly: true
          description: User password; never included in responses or logs.

    UserRole:
      type: array
      items:
        type: string
        enum: [ADMIN, EDITOR, APPROVER, VIEWER, UPLOADER]
        description: |
          ADMIN can read, create, update, upload, and delete.
          EDITOR can read, create, update, and upload.
          VIEWER can only read.

    User:
      type: object
      additionalProperties: false
      required: [id, username, firstName, lastName, role, active]
      properties:
        id:
          type: string
          format: uuid
          example: 6b0bd8e8-55f3-4f20-a199-25a5808a7cce
        username:
          type: string
          minLength: 1
          maxLength: 128
          example: alex.smith
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: Alex
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: Smith
        email:
          type: string
          format: email
          maxLength: 254
          example: alex.smith@example.com
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
          description: Whether the user account is enabled.
          example: true

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - INTERNAL_SERVER_ERROR
          example: BAD_REQUEST
        message:
          type: string
          minLength: 1
          description: Human-readable error explanation without sensitive details.
          example: Request validation failed.
        requestId:
          type: string
          minLength: 1
          description: Correlation identifier for troubleshooting.
          example: req-2a045ff3
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: Request field, JSON path, or multipart field with an error.
          example: dates[0]
        message:
          type: string
          example: Must be a valid date in YYYY-MM-DD format.
        row:
          type: integer
          format: int32
          minimum: 1
          description: One-based CSV record number, including the header record.
          example: 2

  responses:
    UserNotFound:
      description: No user exists with the specified ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UserConflict:
      description: |
        The username already exists, or the operation would delete,
        deactivate, or demote the last active ADMIN.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    BadRequest:
      description: |
        Malformed request or validation failure, including invalid dates,
        duplicate dates, invalid pagination, mismatched calendar names,
        missing fields, or malformed CSV content.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: |
        Bearer token is missing, invalid, or expired; for login, supplied
        username or password may also be invalid. Credential failures do not
        reveal whether a username exists.
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
          example: Bearer realm="calendar-api"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: |
        The authenticated caller lacks permission, or account policy
        prohibits the requested operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: No calendar exists with the specified name.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: A calendar with the specified name already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'