[project]
name = "calendar-service"
version = "0.1.0"
description = "Calendar system of record for the Fidelity Airflow calendar platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "calendar-core",
]

[tool.fastapi]
entrypoint = "calendar_service.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calendar_service"]
