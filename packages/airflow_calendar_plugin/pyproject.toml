[project]
name = "airflow-calendar-plugin"
version = "0.1.0"
description = "Airflow Timetable plugin scheduling DAGs from a centrally managed calendar"
requires-python = ">=3.12"

# httpx only. See README: Hard constraints. Do not add to this list without a recorded decision.
dependencies = [
    "httpx>=0.27",
]

# airflow is a peer: present in the target environment, never installed by us.
[dependency-groups]
dev = [
    "apache-airflow>=2.9",
]

[project.scripts]
calendar-plugin-selfcheck = "airflow_calendar_plugin.selfcheck:main"

[project.entry-points."airflow.plugins"]
calendar = "airflow_calendar_plugin.plugin:CalendarPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airflow_calendar_plugin"]
