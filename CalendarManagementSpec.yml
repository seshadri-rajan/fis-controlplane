openapi: 3.0.3
info:
  title: Calendar Management API
  version: 1.0.0
  description: |
    API for managing named calendars and their dates.

    When authentication is enabled, all operations require an OAuth
    access token in the Authorization header: Authorization: Bearer <token>.
    Obtain the access token from the configured identity provider; this API does
    not provide a login endpoint. Local development may explicitly disable auth.

    Calendar names are case-sensitive and unique without spaces. Dates are full-date
    strings (DD-MM-YYYY), without time or timezone components. Date arrays
    contain unique values and are returned in ascending order.

    Successful calendar mutations are recorded in the backend audit log.
    Audit records are internal and are not exposed through an audit-history
    operation or displayed by the frontend.

    Read operations are available to all authenticated roles. Calendar
    creation and upload require EDITOR or ADMIN. Amendment and lifecycle
    operations require ADMIN and apply only to uploaded or migrated calendars.

servers:
  - url: /v1
    description: Api version

security:
  - bearerAuth: []

tags:
  - name: Calendars
    description: Create, retrieve, update, and upload calendars.
  - name: Airflow 
    description: Get Dates for Airflow.

paths:
  /calendars:
    post:
      tags: [Calendars]
      operationId: createCalendar
      summary: Create a calendar
      description: |
        Creates a uniquely named calendar. Requires EDITOR or ADMIN.
        Duplicate dates are rejected. Successful creation is recorded in the
        backend audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarCreateRequest'
      responses:
        '201':
          description: Calendar created successfully.
          headers:
            Location:
              description: Relative URI of the created calendar.
              schema:
                type: string
              example: /v1/calendars/business-calendar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [Calendars]
      operationId: listCalendars
      summary: Get a paginated list of calendars
      description: |
        Returns calendars ordered by calendarName ascending.
        An empty collection returns 200 with an empty calendars array.
      parameters:
        - name: limit
          in: query
          description: The number of items to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: The page number to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
            default: 1
        - name: calendarName
          in: query
          description: Case-sensitive substring search by calendar name.
          required: false
          schema:
            type: string
            maxLength: 128
        - name: migrated
          in: query
          description: Flag to determine if its migrated Calendar
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated calendars retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calendars/{calendar_name}:
    parameters:
      - $ref: '#/components/parameters/CalendarName'

    get:
      tags: [Calendars]
      operationId: getCalendar
      summary: Get a calendar by name
      responses:
        '200':
          description: Calendar retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calendars/{calendar_name}/update:
    parameters:
      - $ref: '#/components/parameters/CalendarName'

    patch:
      tags: [Calendars]
      operationId: updateCalendar
      summary: Update an existing calendar
      description: |
        Amends dates on an active uploaded or migrated calendar. Requires ADMIN.
        The request body's calendarName must match the path calendar_name.
        Use the activate/deactivate operations to change status.
        Renaming and creation through this operation are not supported.
        Duplicate dates are rejected. Omitted dates are treated as an empty list.
        Successful amendments are recorded in the backend audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarUpdateRequest'
      responses:
        '200':
          description: Calendar updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calendars/{calendar_name}/activate:
    parameters:
      - $ref: '#/components/parameters/CalendarName'

    post:
      tags: [Calendars]
      operationId: activateCalendar
      summary: Activate an uploaded or migrated calendar
      description: Requires ADMIN. Records the action in the audit log.
      responses:
        '200':
          description: Calendar activated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calendars/{calendar_name}/deactivate:
    parameters:
      - $ref: '#/components/parameters/CalendarName'

    post:
      tags: [Calendars]
      operationId: deactivateCalendar
      summary: Deactivate an uploaded or migrated calendar
      description: Requires ADMIN. Records the action in the audit log.
      responses:
        '200':
          description: Calendar deactivated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calendars/{calendar_name}/dates:
    parameters:
      - $ref: '#/components/parameters/CalendarName'

    get:
      tags: [Airflow]
      operationId: getCalendarDates
      summary: Get calendar dates
      description: |
        Returns the calendar's stored dates as a JSON array of full-date strings,
        sorted ascending. An empty calendar returns []. If excludeCalendar is
        specified, subtract its stored dates. Either missing calendar returns 404.
      parameters:
        - in: query
          name: excludeCalendar
          required: false
          description: The exclude calendar name if applicable.
          schema:
            $ref: '#/components/schemas/CalendarName'
      responses:
        '200':
          description: Calendar dates retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarDates'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calendars/{calendar_name}/export:
    parameters:
      - $ref: '#/components/parameters/CalendarName'

    get:
      tags: [Calendars]
      operationId: exportCalendarDates
      summary: Export all calendar dates as an Excel workbook
      description: |
        Returns every stored date for the selected calendar in ascending order.
        The workbook has one `Calendar date` column and uses `YYYY-MM-DD` values.
      responses:
        '200':
          description: Excel workbook containing all dates for the calendar.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calendars/upload/verify:
    post:
      tags: [Calendars]
      operationId: verifyDates
      summary: Verify dates in an Excel upload before saving
      description: |
        Validates every date row in the workbook and returns a row-level valid
        flag and errors. A verification result with valid=false must not be
        uploaded. Dates before today are always invalid. Unless amend=true,
        dates must be in the current or next calendar year.
      parameters:
        - in: query
          name: amend
          required: false
          description: Allows future years already held by a calendar; ADMIN only.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [data, file]
              properties:
                data:
                  type: object
                  required: [year]
                  additionalProperties: false
                  properties:
                    year:
                      type: string
                      pattern: '^[0-9]{4}$'
                file:
                  type: string
                  format: binary
                  description: Single-column .xlsx workbook with YYYY-MM-DD date values.
            encoding:
              data:
                contentType: application/json
              file:
                contentType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        '200':
          description: Row-by-row validation results; invalid rows are returned, not uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadVerificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Uploaded file exceeds the limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request or uploaded file has an unsupported media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calendars/{calendar_name}/upload:
    parameters:
      - $ref: '#/components/parameters/CalendarName'

    post:
      tags: [Calendars]
      operationId: uploadCalendarDates
      summary: Upload calendar dates from an Excel workbook
      description: |
        Requires EDITOR or ADMIN. Creates the calendar if it does not exist;
        newly created names must contain 1 to 70 letters or digits.

        Accepts a JSON metadata part with a four-digit year and an .xlsx workbook.
        The year must be the current or next calendar year. The workbook must
        contain one worksheet, a single `Calendar date` column, and 1 to 366
        text dates in `YYYY-MM-DD` format. Every date must be in the requested year.

        Atomically replaces the stored dates for that year and marks the calendar
        as uploaded. Duplicate, invalid, or out-of-year dates are rejected.
        Successful uploads are recorded in the backend audit log.
      parameters:
        - name: createOnly
          in: query
          required: false
          description: |
            When true, return 409 if the calendar name already exists. Use this
            for create-from-file so a duplicate name cannot overwrite a calendar.
            When false or omitted, upload to an existing calendar or create it if absent.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [data, file]
              properties:
                data:
                  type: object
                  additionalProperties: false
                  required: [year]
                  properties:
                    year:
                      type: string
                      pattern: '^[0-9]{4}$'
                      example: '2027'
                file:
                  type: string
                  format: binary
                  description: Single-column .xlsx workbook with YYYY-MM-DD date values.
            encoding:
              data:
                contentType: application/json
              file:
                contentType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        '201':
          description: Dates replaced successfully; returns the updated calendar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The calendar already exists and createOnly is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Uploaded file exceeds the limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Request or uploaded file has an unsupported media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calendars/uploadedCalendars:
    get:
      tags: [Calendars]
      operationId: getUploadedCalendars
      summary: Get uploaded calendars
      description: |
        Returns uploaded calendar names and migration flags, ordered by name.
        An empty result returns [].
      responses:
        '200':
          description: Uploaded calendars retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedCalendarNames'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        When authentication is enabled, supply an OAuth access token:
        Authorization: Bearer <token>.

  parameters:
    CalendarName:
      name: calendar_name
      in: path
      required: true
      description: Unique, case-sensitive calendar name.
      schema:
        $ref: '#/components/schemas/CalendarName'

  schemas:
    CalendarName:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$'
      description: |
        Starts with an ASCII letter or digit and contains only ASCII letters,
        digits, underscores, and hyphens. The exact name uploadedCalendars is
        reserved for the collection endpoint and cannot be created or uploaded.
      example: business-calendar

    UploadedCalendarNames:
      type: array
      uniqueItems: true
      description: Names of uploaded calendars.
      items:
        type: object
        additionalProperties: false
        required: [name, migrated]
        properties:
          name:
            $ref: '#/components/schemas/CalendarName'
          migrated:
            type: boolean
            description: Whether the calendar has been migrated.
      example:
        - name: business-calendar
          migrated: false
        - name: nyse-calendar
          migrated: true

    CalendarDate:
      type: string
      pattern: '^[0-9]{2}-[0-9]{2}-[0-9]{4}$'
      description: Valid calendar date in DD-MM-YYYY format.
      example: '25-12-2027'

    CalendarDates:
      type: array
      uniqueItems: true
      description: Unique calendar dates; responses are sorted ascending.
      items:
        $ref: '#/components/schemas/CalendarDate'

    UploadVerificationResponse:
      type: object
      additionalProperties: false
      required: [year, valid, items, errors]
      properties:
        year:
          type: integer
        valid:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/UploadVerificationItem'
        errors:
          type: array
          items:
            type: string

    UploadVerificationItem:
      type: object
      additionalProperties: false
      required: [row, value, date, valid, errors]
      properties:
        row:
          type: integer
          minimum: 2
        value:
          type: string
          nullable: true
        date:
          type: string
          nullable: true
          format: date
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
      example:
        - '01-01-2027'
        - '25-12-2027'

    CalendarCreateRequest:
      type: object
      additionalProperties: false
      required: [calendarName]
      properties:
        calendarName:
          $ref: '#/components/schemas/NewCalendarName'
        dates:
          $ref: '#/components/schemas/CalendarDates'

    NewCalendarName:
      type: string
      minLength: 1
      maxLength: 70
      pattern: '^[A-Za-z0-9]{1,70}$'
      description: New calendar names contain only ASCII letters and digits.
      example: BusinessCalendar2027

    CalendarUpdateRequest:
      type: object
      additionalProperties: false
      required: [calendarName, status]
      properties:
        calendarName:
          $ref: '#/components/schemas/CalendarName'
        dates:
          $ref: '#/components/schemas/CalendarDates'
        status:
          $ref: '#/components/schemas/CalendarStatus'

    CalendarStatus:
      type: string
      enum: 
        - ACTIVE
        - INACTIVE
      description: The status of the Calendar
      example: ACTIVE
      

    Calendar:
      type: object
      additionalProperties: false
      required: [calendarName, dates, migrated, uploaded, status, createdBy, createdAt, updatedAt]
      properties:
        calendarName:
          $ref: '#/components/schemas/CalendarName'
        dates:
          $ref: '#/components/schemas/CalendarDates'
        migrated:
          type: boolean
          example: false
        uploaded:
          type: boolean
          description: Flag to determine if this calendar was uploaded via file or created from UI
        status:
          $ref: '#/components/schemas/CalendarStatus'
        createdBy:
          type: string
          readOnly: true
          minLength: 1
          description: Username of the authenticated creator.
          example: alex smith
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Creation timestamp in UTC.
          example: '2026-11-03T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Last modification timestamp in UTC; initially createdAt.
          example: '2026-11-03T10:00:00Z'
    CalendarPage:
      type: object
      additionalProperties: false
      required: [calendars, page, pageSize, totalItems, totalPages]
      properties:
        calendars:
          type: array
          items:
            $ref: '#/components/schemas/Calendar'
        page:
          type: integer
          format: int32
          minimum: 1
          example: 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          example: 20
        totalItems:
          type: integer
          format: int64
          minimum: 0
          example: 42
        totalPages:
          type: integer
          format: int64
          minimum: 0
          description: Ceiling of totalItems divided by pageSize; zero when empty.
          example: 3
  
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [status, message]
      properties:
        status:
          type: string
          enum:
            - '400'
            - '401'
            - '403'
            - '404'
            - '413'
            - '415'
            - '409'
            - '500'
          example: '400'
        error:
          type: string
          description: Error description
          example: Bad Request
        message:
          type: string
          minLength: 1
          description: Human-readable error explanation without sensitive details.
          example: Request validation failed.
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: Request field, JSON path, or multipart field with an error.
          example: dates[0]
        message:
          type: string
          example: Must be a valid date in DD-MM-YYYY format.

  responses:
    BadRequest:
      description: |
        Malformed request or validation failure, including invalid dates,
        duplicate dates, invalid pagination, mismatched calendar names,
        missing fields, a duplicate calendar name on creation, or malformed Excel workbook content.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: |
        Bearer access token is missing, invalid, or expired.
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
          example: Bearer realm="calendar-api"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: |
        The authenticated caller lacks permission, or account policy
        prohibits the requested operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: No calendar exists with the specified name.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: The requested lifecycle or amendment operation is not valid for this calendar.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'